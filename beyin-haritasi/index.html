<style>
:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}

  --c-is:#6fa3d6; --c-ai:#b08ad9; --c-sites:#4fbfa8; --c-li:#e39a54; --c-side:#ec7591; --c-trade:#a9bb6a; --c-kisi:#b3a99e; --c-diger:#77767e; color-scheme:dark}}
:root[data-theme="dark"]{

  --c-is:#6fa3d6; --c-ai:#b08ad9; --c-sites:#4fbfa8; --c-li:#e39a54; --c-side:#ec7591; --c-trade:#a9bb6a; --c-kisi:#b3a99e; --c-diger:#77767e; color-scheme:dark}

.tag.cl{color:var(--c);border-color:var(--c)}

.card p{margin:0;color:var(--muted)}
.btn{align-self:flex-start;display:inline-flex;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;background:var(--fg);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND={proje:"Proje",kişi:"Kişi",konu:"Konu",araç:"Araç",sohbet:"Sohbet"};
const fmtD=iso=>{try{return new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"short"}).format(new Date(iso));}catch(e){return iso||"";}};
let G=null,nodes=[],links=[],byId={},adj={},hidden=new Set(),sel=null,hover=null,T={x:0,y:0,k:1},W=0,H=0,cv=null,ctx=null,colors={},raf=0;

function show(ids){["gate","empty","stage","chips","findbox"].forEach(x=>$(x).hidden=!ids.includes(x));}
function fail(msg){$("meta").textContent="";$("emptytxt").textContent=msg;show(["empty"]);}

/* ---------- data ---------- */
function load(g){
  G=g;nodes=g.nodes.map(n=>({...n}));byId={};adj={};
  nodes.forEach(n=>{byId[n.id]=n;adj[n.id]=new Set();});
  links=g.edges.filter(e=>byId[e.s]&&byId[e.t]).map(e=>({s:byId[e.s],t:byId[e.t]}));
  links.forEach(l=>{adj[l.s.id].add(l.t.id);adj[l.t.id].add(l.s.id);});
  nodes.forEach(n=>{n.deg=adj[n.id].size;n.chat=n.kind==="sohbet";n.r=n.chat?3:5+Math.sqrt(n.deg)*1.7;});
  const nE=nodes.filter(n=>!n.chat).length;
  $("meta").textContent=nE+" konu ve proje · güncelleme "+fmtD(g.built_at);
  readColors();chips();layout();show(["stage","chips","findbox"]);resize();fit(false);
  const h=decodeURIComponent((location.hash||"").slice(1));if(h&&byId[h])select(h,true);else panelIntro();
}
function readColors(){colors={};Object.keys(G.clusters).forEach(k=>colors[k]=css("--c-"+k)||css("--c-diger"));}

/* ---------- 3D globe: layout on a sphere, run once ---------- */
function rnd(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
const unit=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};
function fib(i,n){const y=1-(i+.5)/n*2,r=Math.sqrt(1-y*y),a=i*2.399963;return [Math.cos(a)*r,y*.82,Math.sin(a)*r];}
let ANCH={};
function layout3(){
  const ks=Object.keys(G.clusters).filter(k=>nodes.some(n=>n.cluster===k)),r=rnd(11);ANCH={};
  ks.forEach((k,i)=>ANCH[k]=unit(fib(i,ks.length)));
  nodes.forEach(n=>{const a=ANCH[n.cluster]||[0,0,1];n.u=unit([a[0]+(r()-.5)*.5,a[1]+(r()-.5)*.5,a[2]+(r()-.5)*.5]);n.v=[0,0,0];});
  const N=nodes.length;
  for(let it=0;it<300;it++){
    const al=1-it/300;
    for(let i=0;i<N;i++){const p=nodes[i];
      for(let j=i+1;j<N;j++){const q=nodes[j];let dx=p.u[0]-q.u[0],dy=p.u[1]-q.u[1],dz=p.u[2]-q.u[2],d2=dx*dx+dy*dy+dz*dz;
        if(d2>.36)continue;d2=Math.max(d2,.0004);
        const c=((p.chat?.00011:.0009)+(q.chat?.00011:.0009))*al,f=c/d2;
        dx*=f;dy*=f;dz*=f;p.v[0]+=dx;p.v[1]+=dy;p.v[2]+=dz;q.v[0]-=dx;q.v[1]-=dy;q.v[2]-=dz;}}
    links.forEach(l=>{const s=l.s,t=l.t,dx=t.u[0]-s.u[0],dy=t.u[1]-s.u[1],dz=t.u[2]-s.u[2],d=Math.hypot(dx,dy,dz)||.001;
      const L=s.chat||t.chat?.09:.3,k=(s.cluster===t.cluster?.08:.01)*al,f=(d-L)/d*k;
      s.v[0]+=dx*f;s.v[1]+=dy*f;s.v[2]+=dz*f;t.v[0]-=dx*f;t.v[1]-=dy*f;t.v[2]-=dz*f;});
    nodes.forEach(n=>{const a=ANCH[n.cluster]||n.u;for(let c=0;c<3;c++){n.v[c]+=(a[c]-n.u[c])*.02*al;n.v[c]*=.6;n.u[c]+=n.v[c];}n.u=unit(n.u);});
  }
  nodes.forEach(n=>n.rad=n.chat?1.06:1);
}
const MOTION=!matchMedia("(prefers-reduced-motion: reduce)").matches;
let yaw=.5,pitch=-.2,vyaw=0,vpitch=0,zoomK=1,dragging=false,anim=null,lastF=0,lastAct=performance.now(),S=200,cd=3.2;
const poke=()=>{lastAct=performance.now();lastSeen=lastAct;};let lastSeen=performance.now(),mouseAt=null;
function project(u,rad){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=u[0]*cy+u[2]*sy,z1=-u[0]*sy+u[2]*cy,y2=u[1]*cp-z1*sp,z2=u[1]*sp+z1*cp;

  if(MODE==="globe"){step3(t,dt);if((sel||hover)&&waveOn()&&!anim&&!dragging)draw();}
  else if(sel||hover){if(waveOn())draw();}
  else if(MOTION&&!PAUSED&&t-lastSeen<120000){drift(t);draw();}
}

/* ---------- panel ---------- */
function rowHTML(n){return `<button data-id="${esc(n.id)}" style="--c:${n.chat?"var(--fg)":"var(--c-"+n.cluster+")"}"><i></i><span class="t">${esc(n.label)}</span><span class="d">${n.chat?fmtD(n.date):n.deg}</span></button>`;}
function bindRows(){$("panel").querySelectorAll(".nb button").forEach(b=>b.onclick=()=>select(b.dataset.id,true));}
function panelIntro(){
  const ents=nodes.filter(n=>!n.chat).sort((a,b)=>b.deg-a.deg).slice(0,8);
  $("panel").innerHTML=`<p class="hint">Bir noktaya dokun: neyle bağlı olduğu ve ilgili siteleri açılır. Her nokta bir konu ya da proje.</p>
  <div class="grp">En çok bağlantısı olanlar</div><div class="nb">${ents.map(rowHTML).join("")}</div>
  <p class="note">Kaynak: ${esc(G.sources||"")}. Yalnız onaylanmış konular gösterilir.</p>`;
  bindRows();
}
function linksHTML(n){const L=(n.links||[]).filter(l=>/^https:\/\//.test(l.u)).slice(0,3);if(!L.length)return "";
  return `<div class="grp">İlgili siteler</div><div class="sites">${L.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer"><span>${esc(l.t)}</span><span class="h">${esc(l.u.replace(/^https?:\/\//,"").replace(/\/$/,""))}</span></a>`).join("")}</div>`;}
function panel(n){
  const nb=[...adj[n.id]].map(i=>byId[i]);
  const ent=nb.filter(x=>!x.chat).sort((a,b)=>b.deg-a.deg),ch=nb.filter(x=>x.chat).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("panel").innerHTML=`<div class="tags"><span class="tag cl" style="--c:var(--c-${n.cluster})">${esc(G.clusters[n.cluster]||"")}</span><span class="tag">${KIND[n.kind]||esc(n.kind)}</span>${n.date?`<span class="tag">${fmtD(n.date)}</span>`:""}</div>
  <h2>${esc(n.label)}</h2>${n.desc?`<p class="desc">${esc(n.desc)}</p>`:""}
  ${n.url?`<a class="open" href="${esc(n.url)}" target="_blank" rel="noopener">Sohbeti aç →</a>`:""}
  <div class="onlym" style="display:flex;flex-direction:column;gap:12px">${linksHTML(n)}${pfBtn(n)}
  ${ent.length?`<div class="grp">Bağlı konular · ${ent.length}</div><div class="nb">${ent.map(rowHTML).join("")}</div>`:""}</div>
  ${ch.length?`<div class="grp">Sohbetler · ${ch.length}</div><div class="nb">${ch.map(rowHTML).join("")}</div>`:""}
  ${!ch.length?`<p class="hint">${ent.length?"Bağlı konular ve siteler haritadaki kutuda.":"Bu noktanın henüz bağlantısı yok."}</p>`:""}`;
  bindRows();bindPF($("panel"));$("panel").scrollTop=0;
}
function popup(n){
  const nb=[...adj[n.id]].map(i=>byId[i]);
  const ch=nb.filter(x=>x.chat).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),ent=nb.filter(x=>!x.chat).sort((a,b)=>b.deg-a.deg);
  const rel=ent.length?`<div class="rel">${ent.slice(0,8).map(e=>`<button data-id="${esc(e.id)}" style="--c:var(--c-${e.cluster})"><i></i>${esc(e.label)}</button>`).join("")}</div>`:"";
  let body;
  if(n.chat){
    body=`<div class="tags"><span class="tag">Sohbet</span>${n.date?`<span class="tag">${fmtD(n.date)}</span>`:""}</div><h3>${esc(n.label)}</h3>${n.desc?`<p class="pd">${esc(n.desc)}</p>`:""}
    <a class="go" href="${esc(n.url)}" target="_blank" rel="noopener">Sohbete git →</a>${ent.length?`<div class="grp">Konuları</div>`+rel:""}`;
  }else{
    body=`<div class="tags"><span class="tag cl" style="--c:var(--c-${n.cluster})">${esc(G.clusters[n.cluster]||"")}</span><span class="tag">${KIND[n.kind]||esc(n.kind)}</span></div><h3>${esc(n.label)}</h3>${n.desc?`<p class="pd">${esc(n.desc)}</p>`:""}
    ${linksHTML(n)}${pfBtn(n)}
    ${ch.length?`<div class="onlym"><div class="grp">Geçtiği sohbetler · ${ch.length}</div><div class="cl">${ch.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener"><span class="tt">${esc(c.label)} <span class="dd">· ${fmtD(c.date)}</span></span><span class="gt" aria-hidden="true">→</span></a>`).join("")}</div></div>`:""}
    ${ent.length?`<div class="grp">Bağlı konular</div>`+rel:""}`;
  }
  focusSet();if(L2MORE)body+=`<p class="pd">Haritada 2. seviyeden ${L2MORE} nokta daha var, kalabalık olmasın diye soluk bırakıldı.</p>`;
  $("pop").innerHTML=`<button class="x" id="popx" aria-label="Kapat">×</button>`+body;$("pop").hidden=false;$("pop").scrollTop=0;
  $("popx").onclick=()=>clearSel();
  $("pop").querySelectorAll(".rel button").forEach(b=>b.onclick=()=>select(b.dataset.id,true));bindPF($("pop"));
}
function select(id,fly){
  const n=byId[id];if(!n)return;if(hidden.has(n.cluster)){hidden.delete(n.cluster);chips();}
  if(PF&&!PF.has(id))personFilter(null);
  sel=id;panel(n);popup(n);if(fly)flyTo(n);else draw();
  try{history.replaceState(null,"","#"+encodeURIComponent(id));}catch(e){}
}
function clearSel(){sel=null;$("pop").hidden=true;panelIntro();draw();try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}

/* ---------- public ön eleme ---------- */
let SCR=null,SCRdb=null,SCRmsg="";
function initScreening(db){
  SCRdb=db;
  db.doc("graph/screening").onSnapshot(s=>{SCR=s.exists?s.data():null;$("scrbtn").hidden=!SCR;if(!$("scr").hidden)renderScr();},()=>{});
  $("scrbtn").onclick=()=>{$("scr").hidden=false;renderScr();};
  $("scr").addEventListener("click",e=>{if(e.target.id==="scr")$("scr").hidden=true;});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")$("scr").hidden=true;});
}
function renderScr(){
  const c=$("scrcard");if(!SCR){c.textContent="Ön eleme verisi yok.";return;}
  const it=SCR.items||[],ch=SCR.choices||{};
  const pub=it.filter(x=>x.cls==="public"),opt=it.filter(x=>x.cls==="oneri"),no=it.filter(x=>x.cls==="cikmamali");
  const nPub=pub.length+opt.filter(x=>ch[x.id]==="public").length,open=opt.filter(x=>!ch[x.id]).length;
  const grp={};no.forEach(x=>(grp[x.why]=grp[x.why]||[]).push(x));
  c.innerHTML=`<div class="scrhead"><div><h2>Public sürüm ön elemesi</h2><p class="note">Burada yalnız seçim yapılır. Public sayfa ayrı onayınla açılır. Çıkmaz grubu kuralla sabit.</p></div><button type="button" class="scrbtn" id="scrx">Kapat ×</button></div>
  <div class="scount">Public'e girecek: ${nPub} nokta · karar bekleyen öneri: ${open}${SCRmsg?" · "+SCRmsg:""}</div>
  <div class="grp">Öneri · ${opt.length} · sen seç</div>
  <div>${opt.map(x=>`<div class="srow"><div><div class="l"></div><div class="w"></div></div><div class="seg" data-id="${esc(x.id)}"><button type="button" data-v="public" aria-pressed="${ch[x.id]==="public"}">Public</button><button type="button" data-v="cikmaz" aria-pressed="${ch[x.id]==="cikmaz"}">Çıkmasın</button></div></div>`).join("")}</div>
  <details><summary>Public · ${pub.length}</summary><ul>${pub.map(()=>"<li></li>").join("")}</ul></details>
  <details><summary>Çıkmaz · ${no.length}</summary>${Object.entries(grp).map(([w,a])=>`<div class="grp" style="margin-top:8px"></div><ul>${a.filter(x=>!x.chat).slice(0,40).map(()=>"<li></li>").join("")}</ul>`).join("")}</details>`;
  const rows=c.querySelectorAll(".srow");opt.forEach((x,i)=>{rows[i].querySelector(".l").textContent=x.label;rows[i].querySelector(".w").textContent=x.why;});
  c.querySelectorAll("details")[0].querySelectorAll("li").forEach((li,i)=>li.textContent=pub[i].label+" — "+pub[i].why);
  const gd=c.querySelectorAll("details")[1],ge=Object.entries(grp);
  gd.querySelectorAll(".grp").forEach((g,i)=>{const a=ge[i][1];g.textContent=ge[i][0]+" · "+a.length;const L=a.filter(x=>!x.chat).slice(0,40);gd.querySelectorAll("ul")[i].querySelectorAll("li").forEach((li,j)=>li.textContent=L[j].label);});
  $("scrx").onclick=()=>{$("scr").hidden=true;};
  c.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{
    const id=b.parentNode.dataset.id,v=b.dataset.v,next={...(SCR.choices||{})};next[id]=next[id]===v?null:v;if(!next[id])delete next[id];
    SCR={...SCR,choices:next};SCRmsg="kaydediliyor…";renderScr();
    try{await SCRdb.doc("graph/screening").update({choices:next});SCRmsg="kaydedildi";}catch(e){SCRmsg="kaydedilemedi ("+((e&&e.code)||"hata")+")";}
    renderScr();});
}

/* ---------- search ---------- */
let hitList=[],hitIx=0;
const norm=s=>String(s||"").toLocaleLowerCase("tr");
let KW={},KWVOCAB=[],SAMPLE=null,SUG=null,SUGQ="",SUGBUSY=false;
const nrm=x=>norm(x).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
function kwHit(n,qn){const L=KW[n.id];if(!L||qn.length<3)return null;for(const k of L){const kn=nrm(k);if(kn.split(/[\s\-_/.]+/).some(w=>w.startsWith(qn))||(qn.includes(" ")&&kn.includes(qn)))return k;}return null;}
function renderHits(){
  const raw=$("q").value.trim(),q=norm(raw),qn=nrm(raw);
  if(q!==SUGQ){SUG=null;SUGBUSY=false;}
  const nameM=q.length>=2?nodes.filter(n=>vis(n)&&norm(n.label+" "+(n.desc||"")).includes(q)):[];
  const nameS=new Set(nameM.map(n=>n.id));
  const kwM=[];if(qn.length>=3)nodes.forEach(n=>{if(!vis(n)||nameS.has(n.id))return;const k=kwHit(n,qn);if(k)kwM.push([n,k]);});
  QSET=q.length>=2?new Set([...nameS,...kwM.map(x=>x[0].id)]):null;draw();
  if(!q){$("hits").hidden=true;return;}
  const nameL=nameM.sort((a,b)=>(norm(b.label).includes(q)-norm(a.label).includes(q))||(a.chat-b.chat)||(b.deg-a.deg)).slice(0,12);
  const kwL=kwM.sort((a,b)=>(b[0].date||"").localeCompare(a[0].date||"")).slice(0,10);
  hitList=[...nameL,...kwL.map(x=>x[0])];hitIx=0;
  const nq=QSET?QSET.size:0;
  let h=(nq?`<div class="hq">Haritada ${nq} eşleşme yanıyor</div>`:"");
  h+=nameL.map((n,i)=>`<button data-id="${esc(n.id)}" class="${i===0?"on":""}">${esc(n.label)}<span class="k">${n.chat?fmtD(n.date):(KIND[n.kind]||"")}</span></button>`).join("");
  if(kwL.length)h+=`<div class="hq hk">Sohbet içinde geçen kelime</div>`+kwL.map(([n,k],i)=>`<button data-id="${esc(n.id)}" class="${!nameL.length&&i===0?"on":""}">${esc(n.label)}<span class="kw">${esc(k)}</span><span class="k">${n.chat?fmtD(n.date):(KIND[n.kind]||"")}</span></button>`).join("");
  if(!hitList.length){
    h+=`<button disabled>Eşleşen yok</button>`;
    if(SAMPLE&&KWVOCAB.length&&qn.length>=3){
      if(SUG&&SUG.length)h+=`<div class="hq">İlgili olabilecek kelimeler</div><div class="sug">${SUG.map(w=>`<button type="button" class="sw" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
      else if(SUG)h+=`<div class="hq">İlgili kelime bulunamadı</div>`;
      else h+=`<button type="button" class="ask" id="askSug">${SUGBUSY?"Claude düşünüyor…":"Benzer kelimeleri Claude'a sor"}</button>`;
    }
  }
  $("hits").innerHTML=h;$("hits").hidden=false;
  $("hits").querySelectorAll("button[data-id]").forEach(b=>b.onmousedown=e=>{e.preventDefault();pickHit(b.dataset.id);});
  $("hits").querySelectorAll("button.sw").forEach(b=>b.onmousedown=e=>{e.preventDefault();$("q").value=b.dataset.w;renderHits();$("q").focus();});
  const ask=$("askSug");if(ask)ask.onmousedown=e=>{e.preventDefault();if(!SUGBUSY)askSug(raw);};
}
async function askSug(raw){
  SUGBUSY=true;SUGQ=norm(raw);renderHits();
  try{
    const r=await SAMPLE.json(`Bir kişisel arama kutusunda kullanıcı "${raw}" yazdı ama birebir eşleşme yok. Aşağıdaki KELİME LİSTESİ'nden bu aramayla anlamca en ilgili en fazla 8 kelimeyi seç (eş anlamlı, üst/alt kavram, aynı konu, Türkçe/İngilizce karşılık). Yalnız listede birebir bulunan kelimeleri döndür. Yalnız JSON dizi döndür, örnek: ["kelime1","kelime2"]. Uygun yoksa [] döndür.\n\nKELİME LİSTESİ:\n${KWVOCAB.join(", ")}`,{modelTier:"quick"});
    const V=new Set(KWVOCAB);SUG=(Array.isArray(r)?r:[]).map(String).filter(w=>V.has(w)).slice(0,8);
  }catch(e){SUG=[];}
  SUGBUSY=false;if(norm($("q").value.trim())===SUGQ)renderHits();
}
function initKeywords(db){
  db.doc("graph/keywords").onSnapshot(s=>{const d=s.exists?s.data():null;KW=(d&&d.items)||{};const V=new Set();Object.values(KW).forEach(L=>(L||[]).forEach(k=>V.add(k)));KWVOCAB=[...V].sort().slice(0,2500);},()=>{});
  (async()=>{try{SAMPLE=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){SAMPLE=null;}})();
}
function pickHit(id){$("hits").hidden=true;$("q").value="";QSET=null;$("q").blur();select(id,true);}

/* ---------- input ---------- */
function wire(){
  cv=$("cv");ctx=cv.getContext("2d");
  $("q").addEventListener("input",renderHits);
  $("q").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&hitList[hitIx])pickHit(hitList[hitIx].id);
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!hitList.length)return;hitIx=(hitIx+(e.key==="ArrowDown"?1:-1)+hitList.length)%hitList.length;$("hits").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===hitIx));}
    else if(e.key==="Escape")$("hits").hidden=true;});
  $("q").addEventListener("blur",()=>setTimeout(()=>$("hits").hidden=true,120));
  const P=new Map();let mode=null,start=null,moved=false,pinch=0,lastP=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,pos(e));anim=null;cancelAnimationFrame(raf);
    if(P.size===2){mode="pinch";const [a,b]=[...P.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);return;}
    const p=pos(e);mode="drag";start=[p[0],p[1],T.x,T.y];lastP=p;moved=false;dragging=true;vyaw=vpitch=0;cv.classList.add("drag");});
  cv.addEventListener("pointermove",e=>{const p=pos(e);
    if(!P.has(e.pointerId)){const n=pick(...p),id=n?n.id:null;if(id!==hover){hover=id;cv.style.cursor=n?"pointer":"";draw();}return;}
    P.set(e.pointerId,p);
    if(mode==="pinch"&&P.size===2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt(d/pinch,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d;return;}
    if(mode!=="drag")return;
    if(Math.hypot(p[0]-start[0],p[1]-start[1])>8)moved=true;
    if(!moved)return;
    if(MODE==="globe"){const k=1/(S||200);vyaw=(p[0]-lastP[0])*k*1.1;vpitch=-(p[1]-lastP[1])*k*1.1;yaw+=vyaw;pitch=clampP(pitch+vpitch);}
    else{T.x=start[2]+p[0]-start[0];T.y=start[3]+p[1]-start[1];}
    lastP=p;draw();});
  const end=e=>{const p=pos(e);P.delete(e.pointerId);if(mode==="pinch"){if(P.size===0){mode=null;dragging=false;}return;}
    cv.classList.remove("drag");dragging=false;
    if(!moved){const n=pick(...p);if(n)select(n.id,true);else if(sel)clearSel();vyaw=vpitch=0;}
    mode=null;};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",()=>{if(hover&&!P.size){hover=null;draw();}});
  cv.addEventListener("wheel",e=>{e.preventDefault();const [x,y]=pos(e);zoomAt(Math.exp(-e.deltaY*.0015),x,y);},{passive:false});
  $("zin").onclick=()=>zoomAt(1.3,W/2,H/2);
  $("zout").onclick=()=>zoomAt(1/1.3,W/2,H/2);
  $("zfit").onclick=()=>fit(true);
  $("pp").onclick=()=>{PAUSED=!PAUSED;const b=$("pp");b.textContent=PAUSED?"▶":"❚❚";b.setAttribute("aria-label",PAUSED?"Dönüşü başlat":"Dönüşü durdur");b.title=b.getAttribute("aria-label");b.setAttribute("aria-pressed",PAUSED);};
  $("mGlobe").onclick=()=>{if(MODE!=="globe")setMode("globe",true);};
  $("mFlat").onclick=()=>{if(MODE!=="flat")setMode("flat",true);};
  $("mGlobe").setAttribute("aria-pressed",MODE==="globe");$("mFlat").setAttribute("aria-pressed",MODE==="flat");
  window.addEventListener("resize",resize);
  document.addEventListener("keydown",e=>{poke();if(e.key==="Escape"&&sel)clearSel();});
  ["pointerdown","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,poke,{passive:true}));
  window.addEventListener("pointermove",()=>{lastSeen=performance.now();},{passive:true});
  cv.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){const r=cv.getBoundingClientRect();mouseAt=[e.clientX-r.left,e.clientY-r.top];}});
  cv.addEventListener("pointerleave",()=>{mouseAt=null;});
  requestAnimationFrame(loop);
  const recolor=()=>{if(G){readColors();draw();}};
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",recolor);}catch(e){}
  new MutationObserver(recolor).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}

/* ---------- boot ---------- */
(async()=>{
  try{
    wire();
    const r=await fetch("data.json",{cache:"no-cache"});if(!r.ok)throw new Error("veri "+r.status);
    const g=await r.json();if(!g||!g.nodes||!g.nodes.length){show(["empty"]);return;}
    sel=null;hover=null;load(g);
  }catch(err){fail("Sayfa başlatılamadı: "+(err&&err.message||err));}
})();
})();
</script>
