<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Claude Kota Takibi</title>
<style>
:root{--bg:#121212;--card:#1d1d1d;--fg:#eee;--mut:#9a9a9a;--acc:#f5b120;--blue:#3b82f6;--red:#ef4444;--grn:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.k{background:var(--card);border-radius:12px;padding:12px}
.k .l{color:var(--mut);font-size:12px}
.k .v{font-size:24px;font-weight:600}
.k .v small{font-size:13px;color:var(--mut);font-weight:400}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px}
svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid #2a2a2a}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.warn{color:var(--red)}.ok{color:var(--grn)}
</style>
</head>
<body>
<h1>Claude Kota Takibi</h1>
<div class="sub" id="sub">Haftalık limit · sıfırlama Pazartesi 23:00 (İstanbul)</div>
<div class="kpis">
  <div class="k"><div class="l">Son okuma · All models</div><div class="v" id="last">– <small>%</small></div></div>
  <div class="k"><div class="l">Son okuma · Fable only</div><div class="v" id="fable">– <small>%</small></div></div>
  <div class="k"><div class="l">Bu hafta hız</div><div class="v" id="rate">– <small>puan/gün</small></div></div>
  <div class="k"><div class="l">Sıfırlamada tahmini</div><div class="v" id="proj">– <small>%</small></div></div>
</div>
<div class="card"><svg id="chart" viewBox="0 0 700 240"></svg></div>
<div class="card">
<table><thead><tr><th>Okuma (İstanbul)</th><th>All (%)</th><th>Fable (%)</th><th>Δ (puan)</th><th>Hız (puan/saat)</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script>
const TZ='Europe/Istanbul';
const fmt=d=>d.toLocaleString('tr-TR',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
// Haftalık sıfırlama: Pazartesi 23:00 İstanbul = Pazartesi 20:00 UTC
function weekStart(t){const d=new Date(t);const w=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),20));const back=(w.getUTCDay()+6)%7;w.setUTCDate(w.getUTCDate()-back);if(w>d)w.setUTCDate(w.getUTCDate()-7);return w.getTime()}
fetch('usage.json?'+Date.now()).then(r=>r.json()).then(j=>{
  const R=(j.records||[]).map(r=>({...r,t:Date.parse(r.at)})).sort((a,b)=>a.t-b.t);
  if(!R.length)return;
  const L=R[R.length-1], ws=weekStart(L.t), wk=R.filter(r=>weekStart(r.t)===ws);
  document.getElementById('last').innerHTML=L.all_pct+' <small>%</small>';
  document.getElementById('fable').innerHTML=(L.fable_pct??'–')+' <small>%</small>';
  document.getElementById('sub').textContent='Son okuma '+fmt(new Date(L.t))+' · sıfırlama Pazartesi 23:00 (İstanbul)';
  const nextReset=ws+7*864e5;
  if(wk.length>=2){
    const a=wk[0],h=(L.t-a.t)/36e5;
    if(h>0){const perH=(L.all_pct-a.all_pct)/h;
      document.getElementById('rate').innerHTML=(perH*24).toFixed(1)+' <small>puan/gün</small>';
      const p=L.all_pct+perH*(nextReset-L.t)/36e5;
      const el=document.getElementById('proj');el.innerHTML=Math.round(p)+' <small>%</small>';el.className='v '+(p>=100?'warn':'ok');}
  }
  // Tablo
  const rows=document.getElementById('rows');
  R.slice().reverse().forEach((r,i,arr)=>{const prev=arr[i+1];let d='–',v='–';
    if(prev&&weekStart(prev.t)===weekStart(r.t)){const dd=r.all_pct-prev.all_pct;d=(dd>=0?'+':'')+dd;const h=(r.t-prev.t)/36e5;if(h>0)v=(dd/h).toFixed(2)}
    else if(prev){d='sıfırlandı'}
    rows.insertAdjacentHTML('beforeend',`<tr><td>${fmt(new Date(r.t))}</td><td>${r.all_pct}</td><td>${r.fable_pct??'–'}</td><td>${d}</td><td>${v}</td></tr>`)});
  // Grafik: son 21 gün
  const svg=document.getElementById('chart'),W=700,H=240,P=34,t0=Math.max(R[0].t,L.t-21*864e5),t1=Math.max(L.t,t0+864e5);
  const x=t=>P+(t-t0)/(t1-t0)*(W-P-10),y=v=>H-24-(v/100)*(H-40);
  let s='';[0,25,50,75,100].forEach(v=>{s+=`<line x1="${P}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/><text x="4" y="${y(v)+4}" fill="#9a9a9a" font-size="11">${v} %</text>`});
  for(let w=weekStart(t0)+7*864e5;w<=t1;w+=7*864e5)s+=`<line x1="${x(w)}" x2="${x(w)}" y1="10" y2="${H-24}" stroke="#555" stroke-dasharray="3 3"/><text x="${x(w)+3}" y="20" fill="#9a9a9a" font-size="10">sıfırlama</text>`;
  const pts=R.filter(r=>r.t>=t0);
  const line=(k,c)=>{let seg='',prevW=null;pts.forEach(r=>{if(r[k]==null)return;const w=weekStart(r.t);seg+=(prevW===w?'L':'M')+x(r.t).toFixed(1)+' '+y(r[k]).toFixed(1)+' ';prevW=w});return `<path d="${seg}" fill="none" stroke="${c}" stroke-width="2"/>`+pts.filter(r=>r[k]!=null).map(r=>`<circle cx="${x(r.t)}" cy="${y(r[k])}" r="3" fill="${c}"/>`).join('')};
  s+=line('all_pct','#f5b120')+line('fable_pct','#3b82f6');
  s+=`<text x="${W-160}" y="${H-6}" fill="#f5b120" font-size="11">● All models (%)</text><text x="${W-60}" y="${H-6}" fill="#3b82f6" font-size="11">● Fable (%)</text>`;
  svg.innerHTML=s;
});
</script>
</body>
</html>
