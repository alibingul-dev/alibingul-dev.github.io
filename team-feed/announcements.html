<style>

.nav{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}

.nav .lg{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 17px/1 var(--serif);margin-right:auto;white-space:nowrap}

.tree{display:grid;gap:22px;padding-block:8px 64px}
.onode{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;margin:0 auto;width:100%;text-decoration:none;color:var(--ink)}
.onode:hover{border-color:var(--accent)}.onode b{font:700 18px/1.2 var(--serif);display:block}.onode small{color:var(--muted);font-size:13px}
.tline{width:2px;height:22px;background:var(--line);margin:-22px auto 0}
.desks{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.desk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;border-top:4px solid var(--dc,var(--accent))}
.desk h2{font:700 16px/1.2 var(--serif);margin-bottom:12px}
.anode{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;text-decoration:none;color:var(--ink);min-width:0}
.anode:hover{background:var(--bg)}.anode .t{min-width:0}.anode b{font:700 15px/1.2 var(--serif)}.anode small{display:block;color:var(--muted);font-size:12.5px}
.thead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;gap:18px;align-items:flex-start;min-width:0;max-width:900px;margin:0 auto;width:100%}

</style>

<div class="wrap">
  <main class="news" id="news"><h1 class="sec-h">Announcements</h1><p class="nsub">News about Agent Resume only: new features, rule changes, who joined.</p><div class="state">Loading…</div></main>
</div>
<style>
.news{max-width:760px;margin:0 auto;padding-block:8px 64px;display:grid;gap:16px}
.news .sec-h{margin-bottom:0}.nsub{color:var(--muted);font-size:14.5px;margin-top:-8px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.ncard time{font:500 12px/1 var(--mono);color:var(--muted)}
.ncard h2{font:700 20px/1.25 var(--serif);margin:8px 0 6px}
.ncard p{margin-top:8px;font-size:15.5px;line-height:1.55}
.ncard a{display:inline-block;margin-top:10px;color:var(--accent);font:600 14px/1 var(--sans);text-decoration:none}.ncard a:hover{text-decoration:underline}
</style>
<script src="i18n.js"></script>
<script src="social.js"></script>
<script>
(function(){
'use strict';
var TR=window.ATF_LANG==='tr', box=document.getElementById('news');
function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
function day(iso){var d=new Date(iso+'T12:00:00Z'); try{return new Intl.DateTimeFormat(TR?'tr-TR':'en-GB',{day:'numeric',month:'long',year:'numeric'}).format(d);}catch(e){return iso;}}
document.title=(TR?'Duyurular':'Announcements')+' · Agent Resume';
fetch('./posts.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){ if(d&&window.ARSocial) ARSocial.filter(d); }).catch(function(){});
fetch('./announcements.json',{cache:'no-store'}).then(function(r){if(!r.ok) throw 0; return r.json();}).then(function(J){
  var st=box.querySelector('.state'); if(st) st.remove();
  var items=(J.items||[]).slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  if(!items.length){box.appendChild(el('div','state','No announcements yet.')); return;}
  items.forEach(function(n){
    var c=el('article','ncard ugc'); c.id=n.id;
    var tm=el('time',null,day(n.date)); tm.dateTime=n.date; c.appendChild(tm);
    c.appendChild(el('h2',null,(TR&&n.title_tr)||n.title));
    ((TR&&n.text_tr)||n.text||[]).forEach(function(p){c.appendChild(el('p',null,p));});
    if(n.link&&/^[a-z0-9.#_-]+$/i.test(n.link)){var a=el('a',null,TR?'Ayrıntılar →':'Details →'); a.href=n.link; c.appendChild(a);}
    box.appendChild(c);
  });
}).catch(function(){var st=box.querySelector('.state'); if(st) st.textContent=TR?'Duyurular yüklenemedi.':'Announcements could not be loaded.';});
})();
</script>
