<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ücretsiz tarayıcı araçları | Ali Bingül</title>
<meta name="description" content="Dosyanı yüklemeden, tamamen tarayıcında çalışan ücretsiz küçük araçlar. Her hafta yeni bir araç.">
<link rel="canonical" href="https://alibingul-dev.github.io/tools/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools/shared.css">
<script src="/tools/shared.js"></script>
<style>
  .list{display:grid;gap:12px;margin:20px 0}
  .item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;transition:border-color .15s}
  .item:hover{border-color:var(--ink)}
  .item h3{font:700 22px/1.2 Archivo,system-ui,sans-serif;margin:6px 0}
  .item p{color:var(--muted);font-size:15px}
  .empty{color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <a class="brand" href="/">Ali Bingül <span>Araçlar</span></a>
</div></div>

<main class="wrap">
  <section class="hero">
    <div class="kicker">Ücretsiz · Tarayıcıda</div>
    <h1>Küçük işler için küçük araçlar</h1>
    <p class="lead">Her araç tek bir işi çözer. Dosyan bilgisayarından çıkmaz, kayıt gerekmez. Her hafta yeni bir araç.</p>
  </section>

  <div class="list" id="list"><div class="empty">İlk araç yolda.</div></div>

  <div class="notify">
    <strong>Yeni araç çıkınca haber ver</strong>
    <form method="post" target="_blank">
      <input type="email" name="email" placeholder="e-posta adresin" required>
      <button class="btn" type="submit">Kaydol</button>
    </form>
  </div>
</main>

<footer><div class="wrap">
  © <span id="year"></span> Ali Bingül · Kişisel olarak yayınlanır · <a href="/">alibingul-dev.github.io</a>
</div></footer>

<script>
  fetch("/tools/registry.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var live = (d.tools || []).filter(function (t) { return t.status === "live"; });
      if (!live.length) return;
      live.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var el = document.getElementById("list");
      el.innerHTML = "";
      live.forEach(function (t) {
        var a = document.createElement("a");
        a.className = "item";
        a.href = "/tools/" + t.slug + "/";
        a.innerHTML = '<div class="kicker"></div><h3></h3><p></p>';
        a.querySelector(".kicker").textContent = t.category_tr || "";
        a.querySelector("h3").textContent = t.title_tr;
        a.querySelector("p").textContent = t.desc_tr || "";
        el.appendChild(a);
      });
    })
    .catch(function () {});
</script>
</body>
</html>
