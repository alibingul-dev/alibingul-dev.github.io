<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ali Bingül · Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f4ef;--ink:#16161a;--muted:#5d5d66;--line:#dcd8cf;--accent:#d9480f}
  @media (prefers-color-scheme: dark){:root{--bg:#111114;--ink:#ecebe6;--muted:#9d9ca6;--line:#2a2a31;--accent:#ff7a3d}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
  svg.lock{width:96px;height:112px;overflow:visible}
  .body{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw .7s cubic-bezier(.65,0,.35,1) .1s forwards}
  .shackle{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;
    animation:draw .6s cubic-bezier(.65,0,.35,1) .45s forwards, open .5s cubic-bezier(.3,1.6,.5,1) 1.25s forwards;transform-origin:72px 46px}
  .key{fill:var(--accent);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .4s cubic-bezier(.2,1.6,.4,1) .95s forwards}
  .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring .8s ease-out 1.3s forwards}
  .kick{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);opacity:0;animation:fade .5s ease-out 1.1s forwards}
  h1{font:700 clamp(32px,7vw,52px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) 1.35s forwards}
  .sub{color:var(--muted);opacity:0;animation:fade .5s ease-out 1.7s forwards}
  .go{margin-top:6px;display:inline-flex;padding:9px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;opacity:0;animation:fade .4s ease-out 2.6s forwards}
  .go:hover{border-color:var(--ink)}
  body.leave .stage{animation:out .4s ease-in forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes open{to{transform:translateY(-12px) rotate(-28deg)}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:scale(1.03)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
</head>
<body>
  <main class="stage">
    <svg class="lock" viewBox="0 0 96 112" aria-hidden="true">
      <path class="shackle" d="M24 50 V34 a24 24 0 0 1 48 0 V50"/>
      <rect class="body" x="10" y="50" width="76" height="56" rx="10"/>
      <circle class="ring" cx="48" cy="76" r="9"/>
      <circle class="key" cx="48" cy="76" r="7"/>
    </svg>
    <div class="kick">Çalışma odası</div>
    <h1>Hoş geldin, Ali</h1>
    <p class="sub">Kapı açılıyor…</p>
    <a class="go" id="go" href="https://claude.ai/artifact/3MTbNKTvQp6ASjE7s8M9wQ">Devam et →</a>
  </main>
<script>
  (function(){
    var HUB = document.getElementById("go").href;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function enter(){ document.body.classList.add("leave"); setTimeout(function(){ location.replace(HUB); }, reduce ? 0 : 380); }
    // replace(): this gate is left out of history, so Back from the workroom lands on the home page.
    setTimeout(enter, reduce ? 300 : 2400);
    document.getElementById("go").addEventListener("click", function(e){ e.preventDefault(); enter(); });
  })();
</script>
</body>
</html>
